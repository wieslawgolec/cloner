name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-20.04, macos-latest]
        ssl: [auto, without]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl pkg-config

      - name: Configure
        working-directory: src
        run: |
          chmod +x configure configure.sh
          if [ "${{ matrix.ssl }}" = "without" ]; then
            bash configure --without-validator --without-ssl
          else
            bash configure --without-validator
          fi

      - name: Build dynamic
        working-directory: src
        run: |
          make dynamic || make -f Makefile.dynamic

      - name: Build static (Linux only)
        if: runner.os == 'Linux'
        working-directory: src
        run: make static || true

      - name: Show binary info
        working-directory: src
        run: |
          echo "=== Build artifacts ==="
          ls -la ../cloner* 2>/dev/null || ls -la . || true
          file ../cloner* 2>/dev/null || true

      - name: Clean
        working-directory: src
        run: make clean || true

  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD
    steps:
      - uses: actions/checkout@v4
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake gcc openssl pkgconf
          run: |
            cd src
            chmod +x configure configure.sh
            bash configure --without-validator
            gmake dynamic || make dynamic
            ls -la ../cloner* || true
