name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-20.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl

      - name: Configure
        working-directory: src
        run: |
          chmod +x configure configure.sh
          bash configure --without-validator
          # Temporary: strip forced -m32 until configure.sh is fully modernized
          sed -i.bak 's/-m32//g' Makefile.* 2>/dev/null || true
          # On macOS, ensure OpenSSL paths if needed later
          if [ "$(uname)" = "Darwin" ]; then
            echo "OpenSSL via Homebrew will be used when SSL support is enabled"
          fi

      - name: Build dynamic
        working-directory: src
        run: |
          make dynamic || make -f Makefile.dynamic

      - name: Build static (Linux only)
        if: runner.os == 'Linux'
        working-directory: src
        run: make static || true

      - name: Show binary info
        working-directory: src
        run: |
          ls -la ../cloner* 2>/dev/null || ls -la . || true
          file ../cloner* 2>/dev/null || true

      - name: Clean
        working-directory: src
        run: make clean || true
